<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Change with memory: mistakes −80%, steps −13%, seconds −6%, Claude cost +2%, tokens +5%">
<title>Change with memory: mistakes −80%, steps −13%, seconds −6%, Claude cost +2%, tokens +5%</title>
<style>
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes growy { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
.barl { transform-box: fill-box; transform-origin: right center; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
.col { transform-box: fill-box; transform-origin: center bottom; animation: growy 1.1s cubic-bezier(.2,.8,.2,1) both; }
.lbl { animation: fade .6s ease both; }
@media (prefers-reduced-motion: reduce) { .bar,.barl,.col,.lbl { animation: none; } }

text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
.mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
</style>
<rect width="1280" height="360" rx="16" fill="#ffffff" stroke="#e4e6eb"/>
<text x="32" y="48" font-size="20" font-weight="700" fill="#0f1115">What memory changed, per request</text>
<text x="32" y="72" font-size="14" fill="#6b7080">Maple &amp; Main support agent, with Retrack vs without. Mistakes and steps drop; cost stays about flat.</text>
<g class="lbl"><rect x="950" y="41" width="12" height="12" rx="3" fill="#6D5AE6"/><text x="968" y="51" font-size="13" fill="#4a4f5c">Decrease</text>
<rect x="1050" y="41" width="12" height="12" rx="3" fill="#b4532a"/><text x="1068" y="51" font-size="13" fill="#4a4f5c">Increase</text></g><text x="32" y="121" font-size="15" font-weight="600" fill="#0f1115">Avoidable mistakes</text><text x="32" y="139" font-size="12" class="mono" fill="#6b7080">15 → 3</text><rect class="barl" style="animation-delay:0.00s" x="360.0" y="108" width="400.0" height="24" rx="4" fill="#6D5AE6"/><text class="lbl" style="animation-delay:0.60s" x="350.0" y="125" text-anchor="end" font-size="15" font-weight="700" fill="#0f1115">−80%</text><text x="32" y="169" font-size="15" font-weight="600" fill="#0f1115">Steps per request</text><text x="32" y="187" font-size="12" class="mono" fill="#6b7080">7.19 → 6.25</text><rect class="barl" style="animation-delay:0.12s" x="695.0" y="156" width="65.0" height="24" rx="4" fill="#6D5AE6"/><text class="lbl" style="animation-delay:0.72s" x="685.0" y="173" text-anchor="end" font-size="15" font-weight="700" fill="#0f1115">−13%</text><text x="32" y="217" font-size="15" font-weight="600" fill="#0f1115">Seconds per request</text><text x="32" y="235" font-size="12" class="mono" fill="#6b7080">8.6 → 8.1</text><rect class="barl" style="animation-delay:0.24s" x="730.0" y="204" width="30.0" height="24" rx="4" fill="#6D5AE6"/><text class="lbl" style="animation-delay:0.84s" x="720.0" y="221" text-anchor="end" font-size="15" font-weight="700" fill="#0f1115">−6%</text><text x="32" y="265" font-size="15" font-weight="600" fill="#0f1115">Claude cost per request</text><text x="32" y="283" font-size="12" class="mono" fill="#6b7080">$0.0344 → $0.0349</text><rect class="bar" style="animation-delay:0.36s" x="760" y="252" width="10.0" height="24" rx="4" fill="#b4532a"/><text class="lbl" style="animation-delay:0.96s" x="780.0" y="269" font-size="15" font-weight="700" fill="#0f1115">+2%</text><text x="32" y="313" font-size="15" font-weight="600" fill="#0f1115">Tokens per request</text><text x="32" y="331" font-size="12" class="mono" fill="#6b7080">17,450 → 18,398</text><rect class="bar" style="animation-delay:0.48s" x="760" y="300" width="25.0" height="24" rx="4" fill="#b4532a"/><text class="lbl" style="animation-delay:1.08s" x="795.0" y="317" font-size="15" font-weight="700" fill="#0f1115">+5%</text><line x1="760" y1="96" x2="760" y2="336" stroke="#6b7080" stroke-width="1.5"/><text x="760" y="356" text-anchor="middle" font-size="12" fill="#6b7080">0% (no change)</text>
</svg>
