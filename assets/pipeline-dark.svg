<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="How Retrack works: capture, verify, distil, recall, guarded by a firewall, regression tests, model migration and a holdout group">
<title>How Retrack works: capture, verify, distil, recall, guarded by a firewall, regression tests, model migration and a holdout group</title>
<style>
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes growy { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
.barl { transform-box: fill-box; transform-origin: right center; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
.col { transform-box: fill-box; transform-origin: center bottom; animation: growy 1.1s cubic-bezier(.2,.8,.2,1) both; }
.lbl { animation: fade .6s ease both; }
@media (prefers-reduced-motion: reduce) { .bar,.barl,.col,.lbl { animation: none; } }

@keyframes nudge { 0%,100% { transform: translateX(-3px); opacity: .45; } 50% { transform: translateX(3px); opacity: 1; } }
.arr { animation: nudge 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .arr { animation: none; } }

text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
.mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
</style>
<rect width="1280" height="330" rx="16" fill="#0d1117" stroke="#2a303a"/>
<g class="lbl" style="animation-delay:0.00s">
<rect x="60.0" y="36" width="272" height="176" rx="14" fill="#161b22" stroke="#2a303a"/>
<circle cx="98.0" cy="74" r="18" fill="#211d3d" stroke="#8F7CFA"/>
<text x="98.0" y="79" text-anchor="middle" font-size="13" font-weight="700" fill="#8F7CFA" class="mono">01</text>
<text x="84.0" y="132" font-size="22" font-weight="700" fill="#f0f2f5">Capture</text>
<text x="84.0" y="164" font-size="14" fill="#b7bcc7">every run: task, tool calls,</text>
<text x="84.0" y="184" font-size="14" fill="#b7bcc7">results, tokens, model</text></g><g class="lbl" style="animation-delay:0.15s">
<rect x="356.0" y="36" width="272" height="176" rx="14" fill="#161b22" stroke="#2a303a"/>
<circle cx="394.0" cy="74" r="18" fill="#211d3d" stroke="#8F7CFA"/>
<text x="394.0" y="79" text-anchor="middle" font-size="13" font-weight="700" fill="#8F7CFA" class="mono">02</text>
<text x="380.0" y="132" font-size="22" font-weight="700" fill="#f0f2f5">Verify</text>
<text x="380.0" y="164" font-size="14" fill="#b7bcc7">tests, tickets, feedback</text>
<text x="380.0" y="184" font-size="14" fill="#b7bcc7">or an AI judge</text></g><g class="lbl" style="animation-delay:0.30s">
<rect x="652.0" y="36" width="272" height="176" rx="14" fill="#161b22" stroke="#2a303a"/>
<circle cx="690.0" cy="74" r="18" fill="#211d3d" stroke="#8F7CFA"/>
<text x="690.0" y="79" text-anchor="middle" font-size="13" font-weight="700" fill="#8F7CFA" class="mono">03</text>
<text x="676.0" y="132" font-size="22" font-weight="700" fill="#f0f2f5">Distil</text>
<text x="676.0" y="164" font-size="14" fill="#b7bcc7">successes → playbooks</text>
<text x="676.0" y="184" font-size="14" fill="#b7bcc7">failures → warnings</text></g><g class="lbl" style="animation-delay:0.45s">
<rect x="948.0" y="36" width="272" height="176" rx="14" fill="#161b22" stroke="#2a303a"/>
<circle cx="986.0" cy="74" r="18" fill="#211d3d" stroke="#8F7CFA"/>
<text x="986.0" y="79" text-anchor="middle" font-size="13" font-weight="700" fill="#8F7CFA" class="mono">04</text>
<text x="972.0" y="132" font-size="22" font-weight="700" fill="#f0f2f5">Recall</text>
<text x="972.0" y="164" font-size="14" fill="#b7bcc7">before the next similar task,</text>
<text x="972.0" y="184" font-size="14" fill="#b7bcc7">only when confident</text></g><g class="arr" style="animation-delay:0.00s"><path d="M 340.0 116 l 7 8 l -7 8" stroke="#8F7CFA" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="arr" style="animation-delay:0.25s"><path d="M 636.0 116 l 7 8 l -7 8" stroke="#8F7CFA" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="arr" style="animation-delay:0.50s"><path d="M 932.0 116 l 7 8 l -7 8" stroke="#8F7CFA" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="lbl" style="animation-delay:0.60s"><rect x="60.0" y="232" width="272" height="66" rx="12" fill="none" stroke="#2a303a" stroke-dasharray="4 4"/>
<text x="80.0" y="259" font-size="14" font-weight="700" fill="#8F7CFA">Firewall</text>
<text x="80.0" y="281" font-size="13" fill="#8b919e">untrusted runs never become memory</text></g><g class="lbl" style="animation-delay:0.75s"><rect x="356.0" y="232" width="272" height="66" rx="12" fill="none" stroke="#2a303a" stroke-dasharray="4 4"/>
<text x="376.0" y="259" font-size="14" font-weight="700" fill="#8F7CFA">Regression tests</text>
<text x="376.0" y="281" font-size="13" fill="#8b919e">every playbook is a test</text></g><g class="lbl" style="animation-delay:0.90s"><rect x="652.0" y="232" width="272" height="66" rx="12" fill="none" stroke="#2a303a" stroke-dasharray="4 4"/>
<text x="672.0" y="259" font-size="14" font-weight="700" fill="#8F7CFA">Model migration</text>
<text x="672.0" y="281" font-size="13" fill="#8b919e">replay memory on a new model</text></g><g class="lbl" style="animation-delay:1.05s"><rect x="948.0" y="232" width="272" height="66" rx="12" fill="none" stroke="#2a303a" stroke-dasharray="4 4"/>
<text x="968.0" y="259" font-size="14" font-weight="700" fill="#8F7CFA">Holdout</text>
<text x="968.0" y="281" font-size="13" fill="#8b919e">the effect is measured, not guessed</text></g>
</svg>
