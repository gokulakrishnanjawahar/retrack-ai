#e4e6eb"/><text x="814.6666666666666" y="126" text-anchor="end" font-size="14" font-weight="700" fill="#1a7f4b">−17%</text><rect x="858.6666666666666" y="96" width="389.3333333333333" height="258" rx="12" fill="#f6f7f9" stroke="#e4e6eb"/><text x="878.6666666666666" y="126" font-size="15" font-weight="700" fill="#0f1115">Tool errors per task</text><text x="878.6666666666666" y="146" font-size="12" fill="#6b7080">lower is better</text><rect class="col" style="animation-delay:0.48s" x="971.3" y="183.4" width="74" height="140.6" rx="4" fill="#8A8F9C"/><text class="lbl" style="animation-delay:1.08s" x="1008.3" y="173.4" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">0.75</text><rect class="col" style="animation-delay:0.60s" x="1061.3" y="277.1" width="74" height="46.9" rx="4" fill="#6D5AE6"/><text class="lbl" style="animation-delay:1.20s" x="1098.3" y="267.1" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1115">0.25</text><line x1="878.6666666666666" y1="324" x2="1228.0" y2="324" stroke="#e4e6eb"/><text x="1228.0" y="126" text-anchor="end" font-size="14" font-weight="700" fill="#1a7f4b">−67%</text>
</svg>
