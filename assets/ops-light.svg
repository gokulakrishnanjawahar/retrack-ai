<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="Ops Desk: success 95% to 100%, tool calls 2.90 to 2.40, tool errors 0.75 to 0.25 per task">
<title>Ops Desk: success 95% to 100%, tool calls 2.90 to 2.40, tool errors 0.75 to 0.25 per task</title>
<style>
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes growy { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
.barl { transform-box: fill-box; transform-origin: right center; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
.col { transform-box: fill-box; transform-origin: center bottom; animation: growy 1.1s cubic-bezier(.2,.8,.2,1) both; }
.lbl { animation: fade .6s ease both; }
@media (prefers-reduced-motion: reduce) { .bar,.barl,.col,.lbl { animation: none; } }

text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
.mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
</style>
<rect width="1280" height="380" rx="16" fill="#ffffff" stroke="#e4e6eb"/>
<text x="32" y="48" font-size="20" font-weight="700" fill="#0f1115">Ops Desk agent: 20 evaluation tasks</text>
<text x="32" y="72" font-size="14" fill="#6b7080">After 16 learning tasks, same seed with and without memory. Each panel has its own scale.</text>
<g class="lbl"><rect x="940" y="41" width="12" height="12" rx="3" fill="#8A8F9C"/>
<text x="958" y="51" font-size="13" fill="#4a4f5c">Without memory</text>
<rect x="1080" y="41" width="12" height="12" rx="3" fill="#6D5AE6"/>
