<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="170" viewBox="0 0 1280 170" role="img" aria-label="Headline results: 80% fewer avoidable mistakes, zero mistakes with memory, 67% fewer tool errors, 2% Claude cost">
<title>Headline results: 80% fewer avoidable mistakes, zero mistakes with memory, 67% fewer tool errors, 2% Claude cost</title>
<style>
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes growy { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
.barl { transform-box: fill-box; transform-origin: right center; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
.col { transform-box: fill-box; transform-origin: center bottom; animation: growy 1.1s cubic-bezier(.2,.8,.2,1) both; }
.lbl { animation: fade .6s ease both; }
@media (prefers-reduced-motion: reduce) { .bar,.barl,.col,.lbl { animation: none; } }

text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
.mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
</style>
<rect width="1280" height="170" rx="16" fill="#0d1117" stroke="#2a303a"/>
